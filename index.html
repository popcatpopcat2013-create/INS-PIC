<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Image Upload &amp; Preview</title>
<style>
:root{--bg:#f5f5f7;--card-bg:#fff;--text-primary:#1d1d1f;--text-secondary:#86868b;--accent:#0071e3;--accent-hover:#0077ed;--accent-active:#005fc4;--shadow-card:0 2px 10px rgba(0,0,0,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%;background:var(--bg);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overscroll-behavior-y:none}
.container{max-width:1080px;margin:0 auto;padding:44px 24px 80px}
header{text-align:center;margin-bottom:36px}
header h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.02em;margin:0 0 8px}
header p{font-size:17px;line-height:1.4;color:var(--text-secondary);margin:0}
.upload-area{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:40px}
.upload-btn{border:0;display:inline-flex;align-items:center;gap:10px;background:var(--accent);color:#fff;font-size:17px;font-weight:600;font-family:inherit;padding:15px 30px;border-radius:980px;box-shadow:0 4px 16px rgba(0,113,227,.32);cursor:pointer;touch-action:manipulation;transition:transform .15s,background-color .15s}
.upload-btn svg{width:20px;height:20px}.upload-btn:active{transform:scale(.96);background:var(--accent-active)}
.count-label{font-size:15px;color:var(--text-secondary);font-weight:500;min-height:18px}
.secondary-actions{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
.preview-all-btn,.preview-favorite-main-btn{border:1.5px solid var(--accent);display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--accent);font-size:15px;font-weight:600;font-family:inherit;padding:9px 16px;border-radius:980px;cursor:pointer;touch-action:manipulation;transition:transform .15s,background-color .15s}
.preview-all-btn svg,.preview-favorite-main-btn svg{width:16px;height:16px}
.preview-all-btn:active,.preview-favorite-main-btn:active{transform:scale(.96);background:rgba(0,113,227,.08)}
.clear-btn{border:0;background:none;color:var(--accent);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;padding:4px 6px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:70px 20px;border:2px dashed rgba(0,0,0,.1);border-radius:20px;color:var(--text-secondary)}
.empty-state svg{width:46px;height:46px;margin-bottom:14px;opacity:.4}.empty-state p{margin:0;font-size:16px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.photo-card,.masonry-item{position:relative;animation:popIn .3s cubic-bezier(.2,.8,.2,1) backwards}
.photo-card{aspect-ratio:1}
.photo-card.removing,.masonry-item.removing{animation:popOut .22s ease forwards;pointer-events:none}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes popOut{to{opacity:0;transform:scale(.8)}}
.photo-card img,.masonry-item img{display:block;border-radius:16px;box-shadow:var(--shadow-card)}
.photo-card img{width:100%;height:100%;object-fit:cover;background:var(--card-bg)}
.masonry-item img{width:100%;height:auto;cursor:pointer;transition:transform .18s}
.delete-btn,.favorite-btn{position:absolute;top:8px;width:30px;height:30px;border:0;border-radius:50%;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 2px 6px rgba(0,0,0,.25);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;touch-action:manipulation;z-index:2}
.delete-btn{right:8px}.favorite-btn{left:8px}.delete-btn svg,.favorite-btn svg{width:15px;height:15px}.favorite-btn.active{background:rgba(0,0,0,.55)}.favorite-btn.active svg{fill:currentColor}.favorite-btn:active,.delete-btn:active{transform:scale(.84)}
.preview-overlay{position:fixed;inset:0;background:var(--bg);z-index:1000;transform:translateY(100%);transition:transform .32s cubic-bezier(.22,1,.36,1);overflow-y:auto;-webkit-overflow-scrolling:touch}
.preview-overlay.open{transform:translateY(0)}
.preview-header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:16px 20px;background:rgba(245,245,247,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.preview-header h2{margin:0;font-size:19px;font-weight:700}.done-btn{border:0;background:none;color:var(--accent);font-size:17px;font-weight:600;font-family:inherit;cursor:pointer;padding:4px 6px}
.masonry{column-width:200px;column-gap:16px;padding:20px}.masonry-item{break-inside:avoid;-webkit-column-break-inside:avoid;margin-bottom:16px}
.masonry-favorite{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.48);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);color:#fff;display:flex;align-items:center;justify-content:center;z-index:2;pointer-events:none}
.masonry-favorite svg{width:17px;height:17px;fill:currentColor}
.image-preview{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .22s,visibility .22s;touch-action:none}
.image-preview.open{opacity:1;visibility:visible;pointer-events:auto}
.image-preview-inner{max-width:min(92vw,900px);max-height:88vh;position:relative;transform:scale(.88);opacity:0;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s}
.image-preview.open .image-preview-inner{transform:scale(1);opacity:1}
.image-preview img{display:block;max-width:92vw;max-height:88vh;width:auto;height:auto;object-fit:contain;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.35),0 4px 16px rgba(0,0,0,.25);user-select:none;-webkit-user-drag:none;pointer-events:none}
.preview-favorite-btn{position:absolute;left:12px;bottom:12px;width:40px;height:40px;border:0;border-radius:50%;background:rgba(0,0,0,.58);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;justify-content:center;padding:0;z-index:3;pointer-events:none}
.preview-favorite-btn svg{width:21px;height:21px}.preview-favorite-btn.active svg{fill:currentColor}
.image-preview-close{position:absolute;top:-12px;right:-12px;width:34px;height:34px;border:0;border-radius:50%;background:rgba(40,40,40,.75);backdrop-filter:blur(10px);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.image-preview-close svg{width:17px;height:17px}
.image-preview-inner.swipe-left{animation:swipeLeft .22s ease}.image-preview-inner.swipe-right{animation:swipeRight .22s ease}
@keyframes swipeLeft{0%{transform:translateX(0) scale(1);opacity:1}45%{transform:translateX(-22px) scale(.97);opacity:.45}100%{transform:translateX(0) scale(1);opacity:1}}
@keyframes swipeRight{0%{transform:translateX(0) scale(1);opacity:1}45%{transform:translateX(22px) scale(.97);opacity:.45}100%{transform:translateX(0) scale(1);opacity:1}}
.favorite-empty{text-align:center;padding:70px 20px;color:var(--text-secondary);font-size:16px;column-span:all}
.favorite-empty .heart{font-size:42px;margin-bottom:12px}
@media(max-width:480px){.container{padding:32px 16px 60px}.gallery{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}.masonry{column-width:140px;column-gap:12px;padding:16px}.masonry-item{margin-bottom:12px}.image-preview{padding:16px}.image-preview img{max-width:94vw;max-height:84vh;border-radius:16px}}
</style>
</head>
<body>
<div class="container" id="mainContainer">
<header><h1>Image Upload &amp; Preview</h1><p>Select photos from your device to preview them instantly</p></header>
<div class="upload-area">
<input type="file" id="fileInput" accept="image/*" multiple style="display:none;">
<button type="button" class="upload-btn" id="uploadBtn">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Choose Photos</span>
</button>
<span class="count-label" id="countLabel"></span>
<div class="secondary-actions">
<button type="button" class="preview-all-btn" id="previewAllBtn" style="display:none;">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg><span>Preview All</span>
</button>
<button type="button" class="preview-favorite-main-btn" id="previewFavoriteMainBtn" style="display:none;">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg><span>Preview Favorite</span>
</button>
<button type="button" class="clear-btn" id="clearBtn" style="display:none;">Clear All</button>
</div>
</div>
<div class="empty-state" id="emptyState">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><p>No photos yet</p>
</div>
<div class="gallery" id="gallery"></div>
</div>

<div class="preview-overlay" id="previewOverlay" role="dialog" aria-modal="true">
<div class="preview-header"><h2 id="previewTitle">All Photos</h2><button type="button" class="done-btn" id="doneBtn">Done</button></div>
<div class="masonry" id="masonryGallery"></div>
</div>

<div class="image-preview" id="imagePreview" role="dialog" aria-modal="true">
<div class="image-preview-inner" id="imagePreviewInner">
<img id="imagePreviewImg" src="" alt="Preview">
<div class="preview-favorite-btn" id="previewFavoriteBtn" aria-hidden="true">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>
</div>
<button type="button" class="image-preview-close" id="imagePreviewClose" aria-label="Close image preview">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
</button>
</div>
</div>

<script>
(function(){
'use strict';
var fileInput=document.getElementById('fileInput'),uploadBtn=document.getElementById('uploadBtn'),gallery=document.getElementById('gallery'),emptyState=document.getElementById('emptyState'),countLabel=document.getElementById('countLabel'),clearBtn=document.getElementById('clearBtn'),previewAllBtn=document.getElementById('previewAllBtn'),previewFavoriteMainBtn=document.getElementById('previewFavoriteMainBtn'),previewOverlay=document.getElementById('previewOverlay'),doneBtn=document.getElementById('doneBtn'),previewTitle=document.getElementById('previewTitle'),masonryGallery=document.getElementById('masonryGallery'),mainContainer=document.getElementById('mainContainer'),imagePreview=document.getElementById('imagePreview'),imagePreviewImg=document.getElementById('imagePreviewImg'),imagePreviewClose=document.getElementById('imagePreviewClose'),imagePreviewInner=document.getElementById('imagePreviewInner'),previewFavoriteBtn=document.getElementById('previewFavoriteBtn');
var photos=[],nextId=1,currentPreviewIndex=-1,previewFavoritesOnly=false;
var DB_NAME='ImageUploadPreviewDB',DB_VERSION=1,STORE_NAME='photos',db=null;

function openDatabase(){return new Promise(function(resolve,reject){if(!window.indexedDB)return reject(new Error('IndexedDB is not supported.'));var r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=function(e){var d=e.target.result;if(!d.objectStoreNames.contains(STORE_NAME))d.createObjectStore(STORE_NAME,{keyPath:'id'});};r.onsuccess=function(e){db=e.target.result;resolve(db)};r.onerror=function(){reject(r.error)}})}
function savePhotoToDB(p){if(!db)return Promise.resolve();return new Promise(function(resolve,reject){var t=db.transaction(STORE_NAME,'readwrite');t.objectStore(STORE_NAME).put({id:p.id,blob:p.blob,name:p.name,favorite:!!p.favorite});t.oncomplete=resolve;t.onerror=function(){reject(t.error)}})}
function deletePhotoFromDB(id){if(!db)return Promise.resolve();return new Promise(function(resolve,reject){var t=db.transaction(STORE_NAME,'readwrite');t.objectStore(STORE_NAME).delete(id);t.oncomplete=resolve;t.onerror=function(){reject(t.error)}})}
function clearPhotosFromDB(){if(!db)return Promise.resolve();return new Promise(function(resolve,reject){var t=db.transaction(STORE_NAME,'readwrite');t.objectStore(STORE_NAME).clear();t.oncomplete=resolve;t.onerror=function(){reject(t.error)}})}
function loadPhotosFromDB(){return new Promise(function(resolve,reject){if(!db)return resolve([]);var r=db.transaction(STORE_NAME,'readonly').objectStore(STORE_NAME).getAll();r.onsuccess=function(){resolve(r.result||[])};r.onerror=function(){reject(r.error)}})}
function createPhotoURL(p){if(!p.url)p.url=URL.createObjectURL(p.blob);return p.url}

function setFavoriteIndicator(el,isFavorite){if(!el)return;el.classList.toggle('active',!!isFavorite)}
function toggleFavorite(id){for(var i=0;i<photos.length;i++){if(photos[i].id===id){photos[i].favorite=!photos[i].favorite;savePhotoToDB(photos[i]).catch(console.error);updateFavoriteButtonsForPhoto(id,photos[i].favorite);updateUI();if(previewOverlay.classList.contains('open')&&previewFavoritesOnly)renderMasonry(true);return}}}
function updateFavoriteButtonsForPhoto(id,isFavorite){var buttons=document.querySelectorAll('[data-favorite-id="'+id+'"]');for(var i=0;i<buttons.length;i++)setFavoriteIndicator(buttons[i],isFavorite);if(currentPreviewIndex!==-1&&photos[currentPreviewIndex]&&photos[currentPreviewIndex].id===id)setFavoriteIndicator(previewFavoriteBtn,isFavorite)}
function makeFavoriteBtn(id,isFavorite){var b=document.createElement('button');b.type='button';b.className='favorite-btn';b.setAttribute('data-favorite-id',String(id));b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>';setFavoriteIndicator(b,isFavorite);b.addEventListener('click',function(e){e.stopPropagation();toggleFavorite(id)});return b}
function makeDeleteBtn(id){var b=document.createElement('button');b.type='button';b.className='delete-btn';b.setAttribute('aria-label','Delete photo');b.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';b.addEventListener('click',function(){removePhoto(id)});return b}

function addCardToDOM(id,url,name,stagger,isFavorite){var card=document.createElement('div');card.className='photo-card';card.dataset.id=id;if(typeof stagger==='number')card.style.animationDelay=(Math.min(stagger,12)*.03)+'s';var img=document.createElement('img');img.src=url;img.alt=name||'Uploaded photo';img.draggable=false;card.appendChild(img);card.appendChild(makeFavoriteBtn(id,!!isFavorite));card.appendChild(makeDeleteBtn(id));gallery.appendChild(card)}

function makeMasonryFavoriteIndicator(){var d=document.createElement('div');d.className='masonry-favorite';d.setAttribute('aria-hidden','true');d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"/></svg>';return d}

function renderMasonry(favoritesOnly){masonryGallery.innerHTML='';var shown=0;photos.forEach(function(p,idx){if(favoritesOnly&&!p.favorite)return;shown++;var item=document.createElement('div');item.className='masonry-item';item.dataset.id=p.id;item.style.animationDelay=(Math.min(shown-1,12)*.03)+'s';var img=document.createElement('img');img.src=createPhotoURL(p);img.alt=p.name||'Uploaded photo';img.draggable=false;img.addEventListener('click',function(){openImagePreview(idx)});item.appendChild(img);if(p.favorite)item.appendChild(makeMasonryFavoriteIndicator());masonryGallery.appendChild(item)});if(shown===0){var e=document.createElement('div');e.className='favorite-empty';e.innerHTML='<div class="heart">♡</div><div>No favorite photos yet</div>';masonryGallery.appendChild(e)}}

function openPreview(favoritesOnly){if(photos.length===0)return;previewFavoritesOnly=!!favoritesOnly;previewTitle.textContent=previewFavoritesOnly?'Favorite Photos':'All Photos';renderMasonry(previewFavoritesOnly);previewOverlay.classList.add('open');previewOverlay.scrollTop=0;document.body.style.overflow='hidden';if('inert' in mainContainer)mainContainer.inert=true;doneBtn.focus()}
function closePreview(){closeImagePreview();previewOverlay.classList.remove('open');document.body.style.overflow='';if('inert' in mainContainer)mainContainer.inert=false;previewFavoritesOnly=false;previewTitle.textContent='All Photos';previewAllBtn.focus()}
previewAllBtn.addEventListener('click',function(){openPreview(false)});
previewFavoriteMainBtn.addEventListener('click',function(){openPreview(true)});
doneBtn.addEventListener('click',closePreview);

function openImagePreview(index){if(index<0||index>=photos.length)return;currentPreviewIndex=index;imagePreviewImg.src=createPhotoURL(photos[index]);setFavoriteIndicator(previewFavoriteBtn,photos[index].favorite);imagePreview.classList.add('open');imagePreviewClose.focus()}
function closeImagePreview(){imagePreview.classList.remove('open');currentPreviewIndex=-1;setTimeout(function(){if(!imagePreview.classList.contains('open'))imagePreviewImg.src=''},250)}
function changePreviewImage(direction){if(currentPreviewIndex===-1)return;var newIndex=currentPreviewIndex+direction;if(newIndex<0||newIndex>=photos.length)return;currentPreviewIndex=newIndex;imagePreviewInner.classList.remove('swipe-left','swipe-right');void imagePreviewInner.offsetWidth;imagePreviewInner.classList.add(direction>0?'swipe-left':'swipe-right');imagePreviewImg.src=createPhotoURL(photos[newIndex]);setFavoriteIndicator(previewFavoriteBtn,photos[newIndex].favorite)}

var touchStartX=0,touchStartY=0,touchStartTime=0;
imagePreview.addEventListener('touchstart',function(e){if(!imagePreview.classList.contains('open')||!e.touches||e.touches.length!==1)return;touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;touchStartTime=Date.now()},{passive:true});
imagePreview.addEventListener('touchend',function(e){if(!imagePreview.classList.contains('open')||!e.changedTouches||e.changedTouches.length!==1)return;var dx=e.changedTouches[0].clientX-touchStartX,dy=e.changedTouches[0].clientY-touchStartY,elapsed=Date.now()-touchStartTime;if(Math.abs(dx)>Math.abs(dy)*1.25&&Math.abs(dx)>=55&&elapsed<=700)changePreviewImage(dx<0?1:-1);touchStartX=touchStartY=touchStartTime=0},{passive:true});
document.addEventListener('keydown',function(e){if(!imagePreview.classList.contains('open'))return;if(e.key==='ArrowLeft'){e.preventDefault();changePreviewImage(-1)}else if(e.key==='ArrowRight'){e.preventDefault();changePreviewImage(1)}else if(e.key==='Escape'){e.preventDefault();closeImagePreview()}});

imagePreviewClose.addEventListener('click',closeImagePreview);
imagePreview.addEventListener('click',function(e){if(e.target===imagePreview)closeImagePreview()});
imagePreviewInner.addEventListener('click',function(e){e.stopPropagation()});

uploadBtn.addEventListener('click',function(){fileInput.click()});
fileInput.addEventListener('change',async function(e){var files=Array.prototype.slice.call(e.target.files||[]).filter(function(f){return f.type&&f.type.indexOf('image/')===0});for(var i=0;i<files.length;i++){var f=files[i],p={id:nextId++,blob:f,name:f.name,favorite:false,url:URL.createObjectURL(f)};photos.push(p);addCardToDOM(p.id,p.url,p.name,i,false);try{await savePhotoToDB(p)}catch(err){console.error(err)}}fileInput.value='';updateUI()});

async function removePhoto(id){var index=photos.findIndex(function(p){return p.id===id});if(index===-1)return;if(currentPreviewIndex!==-1&&photos[currentPreviewIndex]&&photos[currentPreviewIndex].id===id)closeImagePreview();var p=photos[index],url=p.url;photos.splice(index,1);var main=gallery.querySelector('[data-id="'+id+'"]'),masonry=masonryGallery.querySelector('[data-id="'+id+'"]');[main,masonry].forEach(function(el){if(el){el.classList.add('removing');setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el)},250)}});try{await deletePhotoFromDB(id)}catch(err){console.error(err)}if(url)URL.revokeObjectURL(url);updateUI();if(previewOverlay.classList.contains('open')){if(photos.length===0)closePreview();else renderMasonry(previewFavoritesOnly)}}
clearBtn.addEventListener('click',async function(){photos.forEach(function(p){if(p.url)URL.revokeObjectURL(p.url)});photos=[];currentPreviewIndex=-1;gallery.innerHTML='';masonryGallery.innerHTML='';closeImagePreview();try{await clearPhotosFromDB()}catch(err){console.error(err)}updateUI()});

function updateUI(){var count=photos.length,favorites=photos.filter(function(p){return p.favorite}).length;emptyState.style.display=count===0?'flex':'none';clearBtn.style.display=count?'inline-block':'none';previewAllBtn.style.display=count?'inline-flex':'none';previewFavoriteMainBtn.style.display=favorites?'inline-flex':'none';countLabel.textContent=count?(count+(count===1?' photo selected':' photos selected')):''}

async function initialize(){try{await openDatabase();var saved=await loadPhotosFromDB();saved.sort(function(a,b){return a.id-b.id});saved.forEach(function(s){var p={id:s.id,blob:s.blob,name:s.name||'Uploaded photo',favorite:!!s.favorite,url:null};createPhotoURL(p);photos.push(p);addCardToDOM(p.id,p.url,p.name,undefined,p.favorite);if(p.id>=nextId)nextId=p.id+1});updateUI()}catch(err){console.error('Could not load saved photos:',err);updateUI()}}
initialize();
})();
</script>
</body>
</html>
